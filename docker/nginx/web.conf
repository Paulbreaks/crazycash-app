server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Используем заранее созданные index.wasm.gz и index.pck.gz. В отличие от
    # сжатия на лету это не занимает CPU сервера на каждом первом запуске игры.
    gzip_static on;
    gzip_vary on;
    gzip_types application/wasm application/octet-stream;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ^~ /godot/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # The browser uses one public origin. Strip the /api prefix before passing
    # requests to Fastify, whose route contract starts at /auth, /me, etc.
    location = /api {
        return 308 /api/;
    }

    location ^~ /api/ {
        proxy_pass http://api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(?:js|wasm|pck|png|webp|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
}
