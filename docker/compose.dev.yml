name: crazy-cash

services:
  mysql:
    image: mysql:9.7
    container_name: crazy-cash-mysql-dev
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - '${MYSQL_PORT}:3306'
    volumes:
      - mysql_dev_data:/var/lib/mysql
      - ./mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-p${MYSQL_ROOT_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2.3
    container_name: crazy-cash-phpmyadmin-dev
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - '${PMA_PORT}:80'

  api:
    image: node:26-alpine
    container_name: crazy-cash-api-dev
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    working_dir: /workspace
    environment:
      TZ: ${TZ}
      NODE_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: 3000
      API_ORIGIN: ${API_ORIGIN}
      DEV_API_RESPONSE_DELAY_MS: ${DEV_API_RESPONSE_DELAY_MS:-0}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_INIT_DATA_MAX_AGE_SECONDS: ${TELEGRAM_INIT_DATA_MAX_AGE_SECONDS:-300}
      DATABASE_URL: 'mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}'
      TON_RPC_TESTNET_URL: ${TON_RPC_TESTNET_URL}
      TON_RPC_MAINNET_URL: ${TON_RPC_MAINNET_URL}
      TONCENTER_TESTNET_API_KEY: ${TONCENTER_TESTNET_API_KEY:-}
      TONCENTER_MAINNET_API_KEY: ${TONCENTER_MAINNET_API_KEY:-}
      TON_NETWORK: ${TON_NETWORK:-testnet}
      TON_PROOF_DOMAIN: ${TON_PROOF_DOMAIN:-}
      TON_PROOF_CHALLENGE_TTL_SECONDS: ${TON_PROOF_CHALLENGE_TTL_SECONDS:-600}
      TON_PROOF_MAX_AGE_SECONDS: ${TON_PROOF_MAX_AGE_SECONDS:-600}
      TON_DEPOSIT_RECIPIENT_TESTNET: ${TON_DEPOSIT_RECIPIENT_TESTNET:-}
      TON_DEPOSIT_RECIPIENT_MAINNET: ${TON_DEPOSIT_RECIPIENT_MAINNET:-}
      TON_DEPOSIT_TTL_SECONDS: ${TON_DEPOSIT_TTL_SECONDS:-1800}
      TON_DEPOSIT_MAX_UNITS: ${TON_DEPOSIT_MAX_UNITS:-10000}
      TON_DEPOSIT_FINALITY_SECONDS: ${TON_DEPOSIT_FINALITY_SECONDS:-15}
      TON_DEPOSIT_WATCHER_INTERVAL_SECONDS: ${TON_DEPOSIT_WATCHER_INTERVAL_SECONDS:-5}
      TON_DEPOSIT_ENABLE_MAINNET: ${TON_DEPOSIT_ENABLE_MAINNET:-0}
    volumes:
      - ..:/workspace
      - api_node_modules:/workspace/node_modules
      - pnpm_store:/pnpm/store
    command: >
      sh -c "npm install --global pnpm@10.33.2 &&
      pnpm config set store-dir /pnpm/store &&
      pnpm install --filter @crazy-cash/api... --frozen-lockfile &&
      pnpm --filter @crazy-cash/api prisma:generate &&
      pnpm --filter @crazy-cash/api exec prisma migrate deploy &&
      pnpm --filter @crazy-cash/api dev"
    ports:
      - '${API_PORT}:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 5s
      retries: 10

  guest-cleanup:
    image: node:26-alpine
    container_name: crazy-cash-guest-cleanup-dev
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    working_dir: /workspace
    environment:
      TZ: ${TZ}
      NODE_ENV: development
      DATABASE_URL: 'mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}'
    volumes:
      - ..:/workspace
      - api_node_modules:/workspace/node_modules
      - pnpm_store:/pnpm/store
    command: >
      sh -ec "npm install --global pnpm@10.33.2 &&
      pnpm config set store-dir /pnpm/store &&
      while true; do
        pnpm --filter @crazy-cash/api guest:cleanup;
        sleep 3600;
      done"

  ton-deposit-watcher:
    image: node:26-alpine
    container_name: crazy-cash-ton-deposit-watcher-dev
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    working_dir: /workspace
    environment:
      TZ: ${TZ}
      NODE_ENV: development
      DATABASE_URL: 'mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}'
      TON_RPC_TESTNET_URL: ${TON_RPC_TESTNET_URL}
      TON_RPC_MAINNET_URL: ${TON_RPC_MAINNET_URL}
      TONCENTER_TESTNET_API_KEY: ${TONCENTER_TESTNET_API_KEY:-}
      TONCENTER_MAINNET_API_KEY: ${TONCENTER_MAINNET_API_KEY:-}
      TON_NETWORK: ${TON_NETWORK:-testnet}
      TON_DEPOSIT_RECIPIENT_TESTNET: ${TON_DEPOSIT_RECIPIENT_TESTNET:-}
      TON_DEPOSIT_RECIPIENT_MAINNET: ${TON_DEPOSIT_RECIPIENT_MAINNET:-}
      TON_DEPOSIT_TTL_SECONDS: ${TON_DEPOSIT_TTL_SECONDS:-1800}
      TON_DEPOSIT_MAX_UNITS: ${TON_DEPOSIT_MAX_UNITS:-10000}
      TON_DEPOSIT_FINALITY_SECONDS: ${TON_DEPOSIT_FINALITY_SECONDS:-15}
      TON_DEPOSIT_WATCHER_INTERVAL_SECONDS: ${TON_DEPOSIT_WATCHER_INTERVAL_SECONDS:-5}
      TON_DEPOSIT_ENABLE_MAINNET: ${TON_DEPOSIT_ENABLE_MAINNET:-0}
    volumes:
      - ..:/workspace
      - api_node_modules:/workspace/node_modules
      - pnpm_store:/pnpm/store
    command: >
      sh -ec "npm install --global pnpm@10.33.2 &&
      pnpm config set store-dir /pnpm/store &&
      while true; do
        pnpm --filter @crazy-cash/api ton:deposit-watcher || true;
        sleep \"$${TON_DEPOSIT_WATCHER_INTERVAL_SECONDS}\";
      done"

  # Opt-in locally: the worker selects one configured network and reads keys
  # only from the mounted secret directory.
  ton-withdrawal-worker:
    profiles: [ton-payout]
    image: node:26-alpine
    container_name: crazy-cash-ton-withdrawal-worker-dev
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    working_dir: /workspace
    environment:
      TZ: ${TZ}
      NODE_ENV: development
      DATABASE_URL: 'mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}'
      TON_RPC_TESTNET_URL: ${TON_RPC_TESTNET_URL}
      TON_RPC_MAINNET_URL: ${TON_RPC_MAINNET_URL}
      TONCENTER_TESTNET_API_KEY: ${TONCENTER_TESTNET_API_KEY:-}
      TONCENTER_MAINNET_API_KEY: ${TONCENTER_MAINNET_API_KEY:-}
      TON_NETWORK: ${TON_NETWORK:-testnet}
      TON_WITHDRAW_ENABLE_TESTNET: ${TON_WITHDRAW_ENABLE_TESTNET:-0}
      TON_WITHDRAW_ENABLE_MAINNET: ${TON_WITHDRAW_ENABLE_MAINNET:-0}
      TON_WITHDRAW_SENDER_TESTNET: ${TON_WITHDRAW_SENDER_TESTNET:-}
      TON_WITHDRAW_SENDER_MAINNET: ${TON_WITHDRAW_SENDER_MAINNET:-}
      TON_TESTNET_WITHDRAW_MNEMONIC_FILE: ${TON_TESTNET_WITHDRAW_MNEMONIC_FILE:-/run/secrets/testnet-withdraw-sender.mnemonic}
      TON_MAINNET_WITHDRAW_MNEMONIC_FILE: ${TON_MAINNET_WITHDRAW_MNEMONIC_FILE:-/run/secrets/mainnet-withdraw-sender.mnemonic}
      TON_WITHDRAW_WATCHER_INTERVAL_SECONDS: ${TON_WITHDRAW_WATCHER_INTERVAL_SECONDS:-5}
    volumes:
      - ..:/workspace
      - api_node_modules:/workspace/node_modules
      - pnpm_store:/pnpm/store
      - ${TON_SECRETS_DIR}:/run/secrets:ro
    command: >
      sh -ec "npm install --global pnpm@10.33.2 &&
      pnpm config set store-dir /pnpm/store &&
      if [ \"$${TON_NETWORK}\" = \"testnet\" ]; then
        payout_enabled=\"$${TON_WITHDRAW_ENABLE_TESTNET:-0}\";
      else
        payout_enabled=\"$${TON_WITHDRAW_ENABLE_MAINNET:-0}\";
      fi;
      while true; do
        if [ \"$$payout_enabled\" = \"1\" ]; then
          pnpm --filter @crazy-cash/api ton:withdrawal-worker || true;
          sleep \"$${TON_WITHDRAW_WATCHER_INTERVAL_SECONDS}\";
        else
          sleep 3600;
        fi;
      done"

  web:
    image: node:26-alpine
    container_name: crazy-cash-web-dev
    restart: unless-stopped
    depends_on:
      - api
    working_dir: /workspace
    environment:
      TZ: ${TZ}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      VITE_TG_BOT_NAME: ${VITE_TG_BOT_NAME}
      VITE_TON_MANIFEST_URL: ${VITE_TON_MANIFEST_URL}
      VITE_ENABLE_TONCONNECT: ${VITE_ENABLE_TONCONNECT}
    volumes:
      - ..:/workspace
      - web_node_modules:/workspace/node_modules
      - pnpm_store:/pnpm/store
    command: >
      sh -c "npm install --global pnpm@10.33.2 &&
      pnpm config set store-dir /pnpm/store &&
      pnpm install --filter @crazy-cash/web... --frozen-lockfile &&
      pnpm --filter @crazy-cash/web dev --host 0.0.0.0 --port 5173"
    ports:
      - '${WEB_PORT}:5173'

volumes:
  mysql_dev_data:
  pnpm_store:
  api_node_modules:
  web_node_modules:
