<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover, interactive-widget=overlays-content">
    <title></title>
    <link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>


    <style>
      :root {
        color-scheme: dark;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        border: 0;
        overflow: hidden;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        /* Свободное пространство по бокам портретного холста. */
        background: #021125;
        transition: background 200ms ease;
        touch-action: none;
      }

      /* Поля вокруг canvas рисует именно этот документ внутри iframe, поэтому
         класс получает Shell после открытия MODE-панели. */
      body.mode-panel-open {
        background: #0d0d0d;
      }

      #canvas {
        display: block;
        /* Высота всегда равна высоте окна. Ширина автоматически сохраняет
           портретное соотношение игры; горизонтальный overflow обрезается. */
        height: 100dvh;
        width: auto;
        aspect-ratio: 9 / 16;
        outline: none;
      }

      /*
       * Godot's Web virtual keyboard is experimental. This real DOM input is
       * deliberately almost invisible: Godot remains responsible for the
       * drawn LineEdit, while iOS/Android receive a native numeric keyboard.
       * It must not use display:none/visibility:hidden, otherwise WebKit will
       * refuse to focus it and show the keyboard.
       */
      #crazy-cash-decimal-input {
        position: fixed;
        z-index: 20;
        left: 50%;
        top: 50%;
        width: 1px;
        height: 1px;
        margin: 0;
        padding: 0;
        border: 0;
        opacity: 0.01;
        color: transparent;
        background: transparent;
        font-size: 16px;
        pointer-events: none;
      }

      #loader {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 32%, rgba(16, 111, 171, 0.72) 0%, rgba(5, 49, 88, 0.94) 34%, #03172b 74%);
        color: #ffffff;
        font-family: Arial, sans-serif;
        transition: opacity 320ms ease, visibility 320ms ease;
      }

      #loader.is-hidden {
        visibility: hidden;
        opacity: 0;
        pointer-events: none;
      }

      .loader-content {
        position: relative;
        z-index: 1;
        display: grid;
        width: min(72vw, 340px);
        justify-items: center;
      }

      .loader-logo {
        width: min(58vw, 310px);
        height: auto;
        margin-bottom: 32px;
        filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.48));
      }

      .loader-spinner {
        box-sizing: border-box;
        width: 44px;
        height: 44px;
        margin-bottom: 18px;
        border: 4px solid rgba(255, 255, 255, 0.2);
        border-top-color: #fff200;
        border-right-color: #00b1ff;
        border-radius: 50%;
        animation: loader-orbit 900ms linear infinite;
      }

      .loader-title {
        margin-bottom: 12px;
        color: #ffffff;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-align: center;
      }

      .progress-track {
        box-sizing: border-box;
        width: 100%;
        height: 10px;
        overflow: hidden;
        border: 2px solid #00a8f0;
        border-radius: 999px;
        background: rgba(0, 11, 26, 0.78);
        box-shadow: 0 0 16px rgba(0, 168, 240, 0.28);
      }

      .progress-value {
        width: 0%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #00a8f0, #36d6ff 52%, #fff200);
        box-shadow: 0 0 12px rgba(255, 242, 0, 0.7);
        transition: width 120ms linear;
      }

      .progress-text {
        min-height: 1.2em;
        margin-top: 13px;
        color: #b9dff4;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-align: center;
      }

      #loader.is-error .loader-spinner {
        border-color: rgba(255, 101, 101, 0.4);
        border-top-color: #ff4d4d;
        animation: none;
      }

      #loader.is-error .progress-track {
        border-color: #ff4d4d;
      }

      #loader.is-error .progress-value {
        width: 100%;
        background: #ff4d4d;
      }

      @keyframes loader-orbit {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>

  <body>
    <div id="loader" role="status" aria-live="polite">
      <div class="loader-content">
        <!-- Deliberately independent from Project Settings → Boot Splash.
             This public asset is available before Godot loads its PCK. -->
        <img class="loader-logo" src="../Logo_eng.webp" alt="Crazy Cash">
        <div class="loader-spinner" aria-hidden="true"></div>
        <div class="loader-title">LOADING GAME</div>
        <div class="progress-track" aria-hidden="true">
          <div id="progress-value" class="progress-value"></div>
        </div>
        <div id="progress-text" class="progress-text">PREPARING...</div>
      </div>
    </div>

    <canvas id="canvas" width="1080" height="1920">Your browser does not support the canvas tag.</canvas>
    <input
      id="crazy-cash-decimal-input"
      type="number"
      inputmode="decimal"
    >

    <script src="index.js"></script>
    <script>
      const loader = document.getElementById('loader');
      const progressValue = document.getElementById('progress-value');
      const progressText = document.getElementById('progress-text');
      const canvas = document.getElementById('canvas');
      const decimalInput = document.getElementById('crazy-cash-decimal-input');
      const engine = new Engine({"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":1815248,"index.wasm":37900721},"focusCanvas":false,"gdextensionLibs":[],"godotPoolSize":4});

      let decimalInputCallback = null;

      // This object is accessed only from the Web build through
      // JavaScriptBridge. It never talks to the API and only returns text to
      // the already-visible Godot LineEdit.
      window.CrazyCashDecimalInput = {
        open(value, _maxLength, callback) {
          decimalInputCallback = callback;
          decimalInput.value = String(value);
          decimalInput.focus({ preventScroll: true });
        },
        close() {
          decimalInputCallback = null;
          decimalInput.blur();
        },
      };

      decimalInput.addEventListener('input', () => {
        if (decimalInputCallback) decimalInputCallback(decimalInput.value);
      });

      decimalInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          event.preventDefault();
          window.CrazyCashDecimalInput.close();
        }
      });

      // Layout-сообщение не относится к логике Godot: Shell меняет только
      // свободное пространство вокруг фиксированного портретного canvas.
      window.addEventListener('message', (event) => {
        if (event.origin !== window.location.origin || event.source !== window.parent) return;

        const message = event.data;
        if (message?.type !== 'shell:modePanelBackground' || typeof message.payload?.isOpen !== 'boolean') return;

        document.body.classList.toggle('mode-panel-open', message.payload.isOpen);
      });

      function showLoadFailure(error) {
        console.error(error);
        loader.classList.add('is-error');
        progressText.textContent = 'FAILED TO LOAD';
      }

      engine.startGame({
        canvas,
        // CSS управляет размером холста. Adaptive (2) растягивал его на весь
        // iframe и заставлял Godot рисовать чёрные поля внутри canvas.
        canvasResizePolicy: 0,
        onProgress(current, total) {
          if (!total) {
            progressText.textContent = 'LOADING...';
            return;
          }

          const percent = Math.min(100, Math.round((current / total) * 100));
          progressValue.style.width = `${percent}%`;
          progressText.textContent = `LOADING ${percent}%`;
        },
      }).then(() => {
        progressValue.style.width = '100%';
        progressText.textContent = 'READY';
        window.setTimeout(() => loader.classList.add('is-hidden'), 220);
      }).catch(showLoadFailure);
    </script>
  </body>
</html>
